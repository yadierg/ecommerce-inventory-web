          <div class="grid-2">
            <mat-form-field appearance="outline">
              <mat-label>Precio Venta *</mat-label>
              <input matInput type="number" formControlName="price" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Costo Compra</mat-label>
              <input matInput type="number" formControlName="costPrice" />
            </mat-form-field>
          </div>

          <!-- 👇 SELECTOR DE UNIDAD DE MEDIDA -->
          <mat-form-field appearance="outline">
            <mat-label>Unidad de Medida *</mat-label>
            <mat-select formControlName="unitOfMeasureId">
              @for (unit of unitsOfMeasure(); track unit.id) {
                <mat-option [value]="unit.id">{{ unit.name }} ({{ unit.abbreviation }})</mat-option>
              }
            </mat-select>
          </mat-form-field>
