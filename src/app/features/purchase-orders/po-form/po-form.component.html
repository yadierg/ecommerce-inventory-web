<mat-form-field appearance="outline" class="product-field">
  <mat-label>Producto *</mat-label>
  <input 
    type="text" 
    matInput 
    formControlName="productId" 
    [matAutocomplete]="autoProduct"
    placeholder="Buscar producto..." />
  
  <mat-autocomplete #autoProduct="matAutocomplete" [displayWith]="displayProduct">
    @for (p of availableProducts(); track p.productId) {
      <mat-option [value]="p.productId">
        {{ p.product?.name || 'Producto' }} ({{ p.productId.slice(0,8) }})
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
