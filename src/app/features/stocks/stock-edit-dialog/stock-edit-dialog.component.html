<h2 mat-dialog-title>Editar Stock</h2>
<mat-dialog-content>
  <p class="subtitle">{{ data.stock.product?.name }} en {{ data.stock.warehouse?.name }}</p>
  
  <form [formGroup]="form" class="flex-col">
    <mat-form-field appearance="outline">
      <mat-label>Stock Mínimo (Alerta)</mat-label>
      <input matInput type="number" formControlName="minStock" />
      <mat-hint>Si la cantidad baja de este número, saltará la alerta.</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Stock Máximo (Opcional)</mat-label>
      <input matInput type="number" formControlName="maxStock" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ubicación Física</mat-label>
      <input matInput formControlName="location" placeholder="Ej. A-1-3" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
    Guardar Cambios
  </button>
</mat-dialog-actions>
