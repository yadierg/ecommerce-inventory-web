<div class="dialog-header" [ngClass]="data.color || 'primary'">
  <div class="icon-wrapper">
    <mat-icon>{{ data.color === 'warn' ? 'warning' : 'info' }}</mat-icon>
  </div>
  <h2 mat-dialog-title>{{ data.title }}</h2>
</div>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close(false)">
    {{ data.cancelText || 'Cancelar' }}
  </button>
  <button mat-raised-button [color]="data.color || 'primary'" (click)="ref.close(true)">
    {{ data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
