<header class="header">
  <button mat-icon-button (click)="onToggleSidebar()" class="menu-btn">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- 👇 BUSCADOR GLOBAL -->
  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix class="search-icon">search</mat-icon>
      <input 
        type="text" 
        matInput 
        placeholder="Buscar producto, orden, proveedor..." 
        [formControl]="searchControl"
        [matAutocomplete]="autoSearch"
      />
    </mat-form-field>

    <mat-autocomplete 
      #autoSearch="matAutocomplete" 
      (optionSelected)="onSelectResult($event.option.value)"
      class="search-dropdown"
    >
      @for (result of (searchResults$ | async); track result.id) {
        <mat-option [value]="result">
          <div class="result-item">
            <div class="result-icon" [ngClass]="result.type">
              <mat-icon>{{ result.icon }}</mat-icon>
            </div>
            <div class="result-info">
              <strong>{{ result.title }}</strong>
              <small>{{ result.subtitle }}</small>
            </div>
          </div>
        </mat-option>
      } @empty {
        <mat-option disabled class="no-results">
          Escribe al menos 2 letras para buscar...
        </mat-option>
      }
    </mat-autocomplete>
  </div>

  <div class="spacer"></div>

  <button mat-icon-button (click)="toggleTheme()" matTooltip="Cambiar tema" class="icon-btn">
    <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <div class="v-divider"></div>

  <button mat-button class="user-btn" [matMenuTriggerFor]="menu">
    <div class="avatar">{{ initials() }}</div>
    <div class="user-meta">
      <strong>{{ user?.name || 'Usuario' }}</strong>
      <small>{{ user?.email }}</small>
    </div>
    <mat-icon class="caret">expand_more</mat-icon>
  </button>

  <mat-menu #menu="matMenu" class="user-menu">
    <div class="menu-user">
      <strong>{{ user?.name }}</strong>
      <small>{{ user?.email }}</small>
    </div>
    <mat-divider />
    <button mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>Mi perfil</span>
    </button>
    <button mat-menu-item routerLink="/settings">
      <mat-icon>settings</mat-icon>
      <span>Configuración</span>
    </button>
    <mat-divider />
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</header>
