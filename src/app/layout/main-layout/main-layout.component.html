<div class="layout">
  <!-- Header Full Width (Arriba de todo) -->
  <app-header (toggleSidebar)="toggleSidebar()" class="header-wrapper" />
  
  <!-- Contenedor inferior (Sidebar + Main) -->
  <div class="body-layout">
    <app-sidebar [class.closed]="!isSidebarOpen" class="sidebar-wrapper" />
    
    <main class="main">
      <router-outlet />
    </main>
  </div>

  <!-- Overlay para móviles -->
  <div class="sidebar-overlay" [class.active]="isSidebarOpen" (click)="toggleSidebar()"></div>
</div>
